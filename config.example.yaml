# Copy this file to config.yaml and customize values.
google:
  calendar_id: "your_family_calendar_id@group.calendar.google.com"
  credentials_file: "credentials.json"
  token_file: ".secrets/token.json"

window_days:
  past: 30
  future: 365

run:
  dry_run: true
  lock_file: ".run/color-fixer.lock"

classification:
  # First match in this list wins if multiple categories match.
  priority:
    - completed_task
    - preschool
    - studies
    - travel
    - visits
    - birthday
    - work
    - time_off
    - misc
  categories:
    completed_task:
      color_name: "graphite"
      color_id: "8"
      all_day_only: true
      include_keywords:
        - "klar"
        - "klart"
        - "färdig"
        - "färdigt"
        - "avklarad"
        - "avklarat"
        - "slutförd"
        - "slutfört"
        - "gjord"
        - "gjort"
        - "fixad"
        - "fixat"
        - "ansökt"
        - "sökt"
        - "inskickad"
        - "inskickat"
        - "bokad"
        - "bokat"
        - "betalad"
        - "betalt"
        - "done"
        - "completed"
        - "complete"
        - "finished"
        - "submitted"
        - "applied"
        - "paid"
        - "booked"
      exclude_keywords:
        - "att göra"
        - "todo"
        - "pågående"
        - "under behandling"
        - "väntar"
        - "ska ansöka"
        - "ansökan öppen"
        - "planerar"
        - "planering"
        - "pending"
        - "in progress"
    studies:
      color_name: "grape"
      color_id: "3"
      include_keywords:
        - "study"
        - "studies"
        - "homework"
        - "exam"
        - "assignment"
        - "lab"
        - "university"
        - "college"
        - "application"
        - "enrollment"
      exclude_keywords: []
    preschool:
      color_name: "basil"
      color_id: "10"
      include_keywords:
        - "preschool"
        - "preschools"
        - "kindergarten"
        - "daycare"
        - "school reminder"
      exclude_keywords: []
    travel:
      color_name: "tangerine"
      color_id: "6"
      include_keywords:
        - "travel"
        - "trip"
        - "flight"
        - "train"
        - "hotel"
        - "weekend"
      exclude_keywords: []
    visits:
      color_name: "flamingo"
      color_id: "4"
      include_keywords:
        - "visit"
        - "visiting"
        - "guest"
        - "family visit"
      exclude_keywords: []
    birthday:
      color_name: "banana"
      color_id: "5"
      include_keywords:
        - "birthday"
      exclude_keywords: []
    work:
      color_name: "blueberry"
      color_id: "9"
      include_keywords:
        - "work"
      exclude_keywords: []
    time_off:
      color_name: "sage"
      color_id: "2"
      include_keywords:
        - "day off"
      exclude_keywords: []
    misc:
      color_name: "graphite"
      color_id: "8"
      include_keywords:
        - "car"
        - "vehicle"
        - "passport"
      exclude_keywords: []

# Optional. If set, only events from these organizer emails are considered.
# allowed_organizers:
#   - "you@example.com"
